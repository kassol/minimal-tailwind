{{- /* 外观三态切换：桌面在页眉，手机在页脚；main.js 的 initThemeToggle 统一管理所有 [data-theme-toggle] 组。上下文：dict btn（按钮尺寸 class）icon（图标边长 px） */ -}}
<div role="group" aria-label="外观" data-theme-toggle class="flex gap-0.5 p-0.5 border border-rule rounded-md">
  <button type="button" data-mode="system" aria-label="跟随系统" aria-pressed="true" class="{{ .btn }} flex items-center justify-center rounded text-meta hover:text-accent aria-pressed:bg-tint aria-pressed:text-accent">
    <svg width="{{ .icon }}" height="{{ .icon }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8"/><path d="M12 16v4"/></svg>
  </button>
  <button type="button" data-mode="light" aria-label="浅色" aria-pressed="false" class="{{ .btn }} flex items-center justify-center rounded text-meta hover:text-accent aria-pressed:bg-tint aria-pressed:text-accent">
    <svg width="{{ .icon }}" height="{{ .icon }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button type="button" data-mode="dark" aria-label="深色" aria-pressed="false" class="{{ .btn }} flex items-center justify-center rounded text-meta hover:text-accent aria-pressed:bg-tint aria-pressed:text-accent">
    <svg width="{{ .icon }}" height="{{ .icon }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
  </button>
</div>
