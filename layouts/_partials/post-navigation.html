{{- /* PrevInSection 是更早的一篇 */}}
{{ if or .PrevInSection .NextInSection }}
<nav aria-label="上一篇与下一篇" class="mt-14 md:mt-[88px] border-t border-strong grid md:grid-cols-2 md:gap-6">
  {{ with .PrevInSection }}
  <a href="{{ .RelPermalink }}" class="py-5 md:py-7 flex flex-col gap-1.5 md:gap-2 text-ink hover:text-accent border-b border-rule md:border-b-0">
    <span class="text-[13px] text-meta">← 上一篇</span><span class="text-xl md:text-[22px]">{{ .Title }}</span>
  </a>
  {{ else }}
  <div class="hidden md:block"></div>
  {{ end }}
  {{ with .NextInSection }}
  <a href="{{ .RelPermalink }}" class="py-5 md:py-7 flex flex-col gap-1.5 md:gap-2 md:items-end md:text-right text-ink hover:text-accent">
    <span class="text-[13px] text-meta">下一篇 →</span><span class="text-xl md:text-[22px]">{{ .Title }}</span>
  </a>
  {{ end }}
</nav>
{{ end }}
