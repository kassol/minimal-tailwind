<header class="w-full border-b border-rule">
  <div class="mx-auto box-content max-w-[1120px] px-5 py-2.5 md:py-0 md:min-h-[112px] flex flex-wrap items-center justify-between gap-x-6">
    <a href="{{ site.Home.RelPermalink }}" class="flex items-center gap-2.5 md:gap-3.5 min-h-11 text-ink hover:text-ink">
      {{ partial "seal.html" "w-8 h-8 p-0.5 rounded-[3px] text-[13px] leading-[14px] md:w-10 md:h-10 md:text-base md:leading-[18px]" }}
      <span class="text-lg md:text-[22px] tracking-[0.08em]">{{ site.Title }}</span>
    </a>
    <div class="ml-auto flex items-center gap-2 md:gap-8">
      <nav aria-label="主导航" class="flex items-center gap-1 md:gap-9 text-base md:text-[17px]">
        {{- range site.Menus.main }}
        <a href="{{ .URL }}" class="inline-flex items-center min-h-11 px-2 md:px-0 text-ink hover:text-accent">{{ .Name }}</a>
        {{- end }}
      </nav>
      <div class="flex items-center gap-2">
        {{- if site.Params.darkMode }}
        <div role="group" aria-label="外观" data-theme-toggle class="flex gap-0.5 p-0.5 border border-rule rounded-md">
          <button type="button" data-mode="system" aria-label="跟随系统" aria-pressed="true" class="w-11 h-11 md:w-8 md:h-8 flex items-center justify-center rounded text-meta hover:text-accent aria-pressed:bg-tint aria-pressed:text-accent">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8"/><path d="M12 16v4"/></svg>
          </button>
          <button type="button" data-mode="light" aria-label="浅色" aria-pressed="false" class="w-11 h-11 md:w-8 md:h-8 flex items-center justify-center rounded text-meta hover:text-accent aria-pressed:bg-tint aria-pressed:text-accent">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button type="button" data-mode="dark" aria-label="深色" aria-pressed="false" class="w-11 h-11 md:w-8 md:h-8 flex items-center justify-center rounded text-meta hover:text-accent aria-pressed:bg-tint aria-pressed:text-accent">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          </button>
        </div>
        {{- end }}
        {{- with site.Home.OutputFormats.Get "rss" }}
        <a href="{{ .RelPermalink }}" aria-label="RSS 订阅" class="w-11 h-11 flex items-center justify-center text-meta hover:text-accent">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 5a14 14 0 0 1 14 14"/><path d="M5 11a8 8 0 0 1 8 8"/><circle cx="6" cy="18" r="1.2"/></svg>
        </a>
        {{- end }}
      </div>
    </div>
  </div>
</header>
