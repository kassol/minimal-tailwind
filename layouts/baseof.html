<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="min-h-screen flex flex-col items-center bg-paper">
  {{ partial "header.html" . }}
  <main class="container flex-1 flex flex-col mx-auto px-4 pt-7 pb-8 lg:pt-[72px]">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
